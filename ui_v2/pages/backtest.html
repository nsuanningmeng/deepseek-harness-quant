<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Deepseek HARNESS Quant · 回测</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/v2/assets/ui_common.css">
<link rel="stylesheet" href="/v2/assets/anim_common.css">
<link rel="stylesheet" href="/v2/assets/app.css">
<style>
  .bt-ctl { display:flex; flex-wrap:wrap; gap:12px; margin:12px 0; align-items:end; }
  .bt-ctl label { font-size:12px; color:#a1a1aa; }
  .bt-ctl select, .bt-ctl input { margin-left:4px; padding:6px 8px; border:1px solid #2a2a30; border-radius:8px; font-size:12px; outline:none; }
  .bt-ctl select:focus, .bt-ctl input:focus { border-color:var(--navy2); }
  .bt-kpi { display:flex; flex-wrap:wrap; gap:16px; margin:12px 0; }
  .bt-kpi .k { min-width:104px; }
  .bt-kpi .lb { font-size:11px; color:#a1a1aa; }
  .bt-kpi .vl { font-size:22px; font-weight:700; font-variant-numeric:tabular-nums; }
  .bt-stat { width:100%; border-collapse:collapse; font-size:12px; }
  .bt-stat td { padding:7px 10px; border-bottom:1px solid rgba(255,255,255,.08); }
  .bt-stat td:first-child { color:#a1a1aa; }
  .bt-stat td:last-child { text-align:right; font-weight:600; font-variant-numeric:tabular-nums; }
  .bt-legend { display:flex; gap:16px; font-size:12px; color:#a1a1aa; margin:6px 0; }
  .bt-legend .sw { display:inline-block; width:14px; height:3px; border-radius:2px; margin-right:5px; vertical-align:2px; }
  .vtag { font-size:11px; padding:2px 8px; border-radius:6px; font-weight:600; margin-left:6px; white-space:nowrap; }
  .vtag-yx { background:rgba(39,174,96,.12); color:#4ade80; }
  .vtag-wx { background:rgba(235,87,87,.12); color:#eb5757; }
  .bt-filter { display:flex; flex-wrap:wrap; gap:8px; margin:10px 0; align-items:center; }
  .pitch-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr)); gap:10px 14px; margin:12px 0; }
  .pitch-grid label { display:grid; gap:4px; }
  .pitch-grid input { box-sizing:border-box; width:100%; min-width:0; margin-left:0; }
  .pitch-actions { display:flex; flex-wrap:wrap; align-items:center; gap:10px; }
  .pitch-actions button { min-height:30px; }
  .pitch-result { margin-top:14px; }
  .pitch-scroll { overflow-x:auto; }
  .pitch-table { font-variant-numeric:tabular-nums; }
  .pitch-table th, .pitch-table td { white-space:nowrap; }
  .pitch-result details { margin-top:12px; }
  .pitch-result summary { cursor:pointer; font-size:12px; }
  #pitch-forward .pitch-table { min-width: 420px; }
  #pitch-forward .pitch-table th { padding:7px 10px; }
  #pitch-forward .pitch-table tbody th { border-bottom:1px solid rgba(255,255,255,.08); color:#a1a1aa; font-weight:400; }
  #pitch-forward .pitch-table th, #pitch-forward .pitch-table td { text-align:right; }
  #pitch-forward .pitch-table th:first-child, #pitch-forward .pitch-table td:first-child { text-align:left; }
</style>
</head>
<body style="background:var(--bg);margin:0">
<div id="sidebar"></div>
<div class="v2-wrap">
  <div class="v2-h"><span class="bar"></span><h1>回测</h1><span class="sub">策略回测 · 参数化运行 · 历史归档</span></div>

  <!-- 策略回测（参数 + 运行 + 结果） -->
  <div class="v2-card anim-fade-in-up d0" style="margin-top:14px">
    <h2> 策略回测 <span class="tag">按参数即时跑 · 复用缓存秒级重跑</span></h2>
    <div class="bt-ctl">
      <label>筛选
        <select id="bt-cat-filter" style="width:86px">
          <option value="">全部</option>
          <option value="策略">策略</option>
          <option value="复刻">复刻</option>
          <option value="因子">因子</option>
        </select>
      </label>
      <input id="bt-search" placeholder="搜索策略…" style="width:110px;padding:6px 8px;border:1px solid #2a2a30;border-radius:8px;background:#131316;color:#d4d4d8;font-size:12px;outline:none">
      <label>策略
        <select id="bt-strategy"><option value="">加载中…</option></select>
      </label>
      <label>TopN <input id="bt-topn" type="number" value="5" min="1" max="20" style="width:56px"></label>
      <label>股票数 <input id="bt-stocks" type="number" value="300" min="50" max="3000" step="50" style="width:76px"></label>
      <label>起 <input id="bt-start" value="2021-01-01" style="width:92px"></label>
      <label>止 <input id="bt-end" value="2025-12-31" style="width:92px"></label>
      <button class="v2-btn" id="bt-run" style="margin-left:4px">运行回测</button>
    </div>
    <div class="mini" id="bt-strategy-desc" style="color:#a1a1aa;margin-top:8px;line-height:1.8">加载策略目录…</div>
    <div id="bt-result"><div class="mini" style="opacity:.6">选择参数后点「运行回测」（首次加载数据约 5-15s，重复跑 1-2s）</div></div>
  </div>

  <section class="v2-card anim-fade-in-up d1" style="margin-top:14px" aria-labelledby="pitch-heading">
    <h2 id="pitch-heading">短线 Pitch 参数扫描</h2>
    <p class="mini">用较早的历史筛选参数，再把入选组合同基线放到之后的样本外区间比较。</p>
    <form id="pitch-form">
      <div class="bt-ctl pitch-grid">
        <label>扫参目标
          <select id="pitch-profile">
            <option value="return">净收益优先</option>
            <option value="drawdown" disabled>基线回撤约束</option>
          </select>
        </label>
        <label>筛选期开始 <input id="pitch-train-start" type="date" required></label>
        <label>样本外开始 <input id="pitch-test-start" type="date" required></label>
        <label>数据截止（留空取最新） <input id="pitch-end" type="date"></label>
      </div>
      <div class="bt-ctl pitch-grid" aria-describedby="pitch-grid-help">
        <label>选股数量（TopN） <input id="pitch-topn" required></label>
        <label>最长持有（交易日） <input id="pitch-hold" required></label>
        <label>止损（ATR 倍数） <input id="pitch-stop" required></label>
        <label>止盈（ATR 倍数） <input id="pitch-target" required></label>
        <label>仓位系数 <input id="pitch-size" required></label>
      </div>
      <p class="mini" id="pitch-grid-help">多个取值用逗号分隔。止损和止盈填 0 表示关闭。仓位系数 1 为原每批买入额度，0.9 为原额度的 90%。</p>
      <div class="pitch-actions">
        <button class="v2-btn" id="pitch-run" type="submit" disabled>运行扫参与样本外验证</button>
        <span class="mini" id="pitch-status" role="status">正在读取扫描配置…</span>
      </div>
    </form>
    <div class="pitch-result" id="pitch-result"></div>
  </section>

  <section id="pitch-forward" class="v2-card" style="margin-top:14px" aria-labelledby="pitch-forward-heading">
    <h2 id="pitch-forward-heading">Pitch 前瞻模拟</h2>
    <p class="mini" id="pitch-forward-status" role="status">正在读取前瞻模拟状态…</p>
    <div id="pitch-forward-comparison"></div>
  </section>

  <!-- 历史记录 -->
  <div class="v2-card anim-fade-in-up d1" style="margin-top:14px">
    <h2> 历史记录 <span class="tag" id="bt-count">…</span></h2>
    <div class="bt-filter" id="bt-filter"></div>
    <div id="bt-archive"><span class="mini" style="opacity:.6">加载中…</span></div>
  </div>
</div>

<script src="/v2/core/api.js"></script>
<script src="/v2/core/render.js"></script>
<script src="/v2/components/icons.js"></script>
<script src="/v2/components/search.js"></script>
<script src="/v2/components/sidebar.js"></script>
<script>
(function () {
  LW.sidebar.render('sidebar', {active: 'backtest'});
  var R = LW.render;
  function escArchive(value) { return String(value == null ? '' : value).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function evidenceLink(value) { try { var url=new URL(value,window.location.origin);return url.origin===window.location.origin?url.pathname+url.search:null; } catch(error) { return null; } }

  /* ---------- SVG 图 ---------- */
  function cummax(arr) { var m = -Infinity, o = []; arr.forEach(function (v) { m = Math.max(m, v); o.push(m); }); return o; }
  function drawdown(nav) { var cm = cummax(nav); return nav.map(function (v, i) { return v / cm[i] - 1; }); }
  function svgSeries(seriesList, opts) {
    opts = opts || {};
    var W = opts.w || 940, H = opts.h || 220, PL = 56, PR = 16, PT = 12, PB = 26;
    var all = [];
    seriesList.forEach(function (s) { all = all.concat(s.data); });
    if (!all.length) return '<div class="mini">无数据</div>';
    var lo = opts.lo != null ? opts.lo : Math.min.apply(null, all);
    var hi = opts.hi != null ? opts.hi : Math.max.apply(null, all);
    if (hi - lo < 1e-9) hi = lo + 1;
    function px(i, n) { return PL + i * (W - PL - PR) / Math.max(n - 1, 1); }
    function py(v) { return PT + (1 - (v - lo) / (hi - lo)) * (H - PT - PB); }
    var grid = '';
    for (var g = 0; g <= 4; g++) {
      var gy = (PT + g * (H - PT - PB) / 4).toFixed(1);
      grid += '<line x1="' + PL + '" y1="' + gy + '" x2="' + (W - PR) + '" y2="' + gy + '" stroke="#d4d4d8" stroke-width="1"/>';
    }
    var zero = (opts.zeroLine && lo < 0 && hi > 0) ? '<line x1="' + PL + '" y1="' + py(0).toFixed(1) + '" x2="' + (W - PR) + '" y2="' + py(0).toFixed(1) + '" stroke="#a1a1aa" stroke-width="1" stroke-dasharray="4,3"/>' : '';
    var lines = seriesList.map(function (s) {
      var pts = [];
      for (var i = 0; i < s.data.length; i++) pts.push(px(i, s.data.length).toFixed(1) + ',' + py(s.data[i]).toFixed(1));
      if (s.fill) {
        var area = pts.join(' ') + ' ' + px(s.data.length - 1, s.data.length).toFixed(1) + ',' + py(lo).toFixed(1) +
          ' ' + px(0, s.data.length).toFixed(1) + ',' + py(lo).toFixed(1);
        return '<polygon points="' + area + '" fill="' + (s.fillColor || 'rgba(39,174,96,.12)') + '" stroke="' + (s.color || '#27ae60') + '" stroke-width="' + (s.width || 1.2) + '"/>';
      }
      return '<polyline points="' + pts.join(' ') + '" fill="none" stroke="' + (s.color || '#5e6ad2') +
        '" stroke-width="' + (s.width || 2) + '"' + (s.dash ? ' stroke-dasharray="5,4"' : '') + '/>';
    }).join('');
    var lbl = '<text x="' + PL + '" y="' + (H - 8) + '" font-size="10" fill="#a1a1aa">' + (opts.x0 || '') + '</text>' +
      '<text x="' + (W - PR) + '" y="' + (H - 8) + '" font-size="10" fill="#a1a1aa" text-anchor="end">' + (opts.x1 || '') + '</text>' +
      '<text x="' + (W - PR) + '" y="' + (PT + 8) + '" font-size="10" fill="#a1a1aa" text-anchor="end">' + (opts.hiLabel || hi.toFixed(2)) + '</text>';
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto">' + grid + zero + lines + lbl + '</svg>';
  }

  function pct(v) { return (v == null || isNaN(v)) ? '—' : (v * 100).toFixed(2) + '%'; }
  function kpiVl(v, color) { return '<div class="k"><div class="lb">' + v.lb + '</div><div class="vl" style="color:' + color + '">' + v.v + '</div></div>'; }

  function renderResult(d) {
    var m = d.metrics || {};
    var ann = m.annual_return;
    var annC = ann == null ? '#a1a1aa' : ann >= 0 ? '#eb5757' : '#27ae60';
    var dd = drawdown(d.nav);
    var kpi =
      '<div class="bt-kpi">' +
      kpiVl({ lb: '年化收益', v: pct(ann) }, annC) +
      kpiVl({ lb: '超额年化', v: d.excess_annual != null ? pct(d.excess_annual) : '—' }, (d.excess_annual >= 0 ? '#eb5757' : '#27ae60')) +
      kpiVl({ lb: '最大回撤', v: pct(m.max_drawdown) }, '#27ae60') +
      kpiVl({ lb: '夏普', v: m.sharpe != null ? m.sharpe.toFixed(2) : '—' }, '#f4f4f5') +
      kpiVl({ lb: '索提诺', v: m.sortino != null ? m.sortino.toFixed(2) : '—' }, '#f4f4f5') +
      kpiVl({ lb: '卡玛', v: m.calmar != null ? m.calmar.toFixed(2) : '—' }, '#f4f4f5') +
      kpiVl({ lb: '期末净值', v: m.final_nav != null ? m.final_nav.toFixed(2) : '—' }, '#f4f4f5') +
      kpiVl({ lb: '月胜率', v: pct(m.monthly_win_rate) }, '#f4f4f5') +
      kpiVl({ lb: '耗时', v: d.elapsed_s + 's' }, '#a1a1aa') +
      '</div>';
    var legend = '<div class="bt-legend"><span><span class="sw" style="background:#5e6ad2"></span>策略净值</span>' +
      '<span><span class="sw" style="background:#f2c94c"></span>全池等权基准</span>' +
      '<span><span class="sw" style="background:#27ae60"></span>超额净值（策略/基准）</span>' +
      '<span style="margin-left:auto">' + d.params.stocks + ' 只 · ' + d.params.start + '~' + d.params.end + '</span></div>';
    var navSeries = [{ data: d.nav, color: '#5e6ad2', width: 2 }];
    if (d.bench_nav && d.bench_nav.length) navSeries.push({ data: d.bench_nav, color: '#f2c94c', width: 1.4, dash: true });
    if (d.excess_nav && d.excess_nav.length) navSeries.push({ data: d.excess_nav, color: '#27ae60', width: 1.2, dash: true });
    var navChart = svgSeries(navSeries, { x0: d.dates[0], x1: d.dates[d.dates.length - 1] });
    var ddVals = dd.map(function (v) { return v * 100; });
    var ddChart = svgSeries([{ data: ddVals, color: '#27ae60', width: 1.2, fill: true }], {
      x0: d.dates[0], x1: d.dates[d.dates.length - 1], hiLabel: '回撤 ' + Math.min.apply(null, ddVals).toFixed(1) + '%'
    });
    var stat = '<table class="bt-stat"><tbody>' +
      '<tr><td>累计收益</td><td style="color:' + annC + '">' + pct(m.total_return) + '</td></tr>' +
      '<tr><td>年化收益</td><td style="color:' + annC + '">' + pct(ann) + '</td></tr>' +
      '<tr><td>最大回撤</td><td style="color:#27ae60">' + pct(m.max_drawdown) + '</td></tr>' +
      '<tr><td>年化波动率</td><td>' + pct(m.volatility) + '</td></tr>' +
      '<tr><td>夏普 / 索提诺 / 卡玛</td><td>' + m.sharpe.toFixed(2) + ' / ' + m.sortino.toFixed(2) + ' / ' + m.calmar.toFixed(2) + '</td></tr>' +
      '<tr><td>日胜率 / 月胜率</td><td>' + pct(m.win_rate) + ' / ' + pct(m.monthly_win_rate) + '</td></tr>' +
      '<tr><td>最佳日 / 最差日</td><td>' + pct(m.best_day) + ' / ' + pct(m.worst_day) + '</td></tr>' +
      '<tr><td>期末净值 / 样本</td><td>' + m.final_nav.toFixed(2) + ' / ' + m.n_days + ' 日</td></tr>' +
      '</tbody></table>';
    document.getElementById('bt-result').innerHTML =
      kpi + legend +
      '<div style="display:grid;grid-template-columns:1fr 220px;gap:14px;align-items:start">' +
        '<div>' + navChart + '<div class="mini" style="margin-top:4px;color:#a1a1aa">净值曲线（策略 vs 基准）</div>' +
        '<div style="margin-top:10px">' + ddChart + '<div class="mini" style="margin-top:4px;color:#a1a1aa">回撤 %（水下面积）</div></div>' +
        '<div>' + stat + '</div>' +
      '</div>' +
      '<div class="mini" style="opacity:.6;margin-top:8px">含成本（佣金万2.6+印花税0.05%+滑点0.1%）；回测非实盘，仅供研究</div>';
  }

  /* ★2026-08-16 策略目录：动态加载（/api/live/backtest_strategies）+ 分类筛选 + 搜索 + 记忆 + 描述 */
  var STRATS = {};
  function applyStrategyMeta() {
    var id = document.getElementById('bt-strategy').value;
    var s = STRATS[id] || {};
    var d = s.defaults || {};
    if (d.topn != null) document.getElementById('bt-topn').value = d.topn;
    if (d.stocks != null) document.getElementById('bt-stocks').value = d.stocks;
    var runBtn = document.getElementById('bt-run');
    var desc = document.getElementById('bt-strategy-desc');
    if (desc) {
      desc.innerHTML =
        '<b style="color:var(--navy2)">' + R._f(s.name || id) + '</b> · <span style="color:' + catColor(s.category) + '">' + R._f(s.category || '') + '</span>' +
        (s.instant === false ? ' · <b style="color:var(--gold)">批处理（约 1-3 分钟，结果入归档）</b>' : '') +
        ' <span style="color:var(--muted)">· ' + R._f(s.desc || '') + '</span>';
    }
    if (runBtn) runBtn.disabled = s.instant === false;
  }
  function renderStrategyOptions() {
    var cat = document.getElementById('bt-cat-filter').value;
    var kw = (document.getElementById('bt-search').value || '').trim();
    var saved = null;
    try { saved = localStorage.getItem('bt.strategy'); } catch (e) {}
    var ids = Object.keys(STRATS).filter(function (id) {
      var s = STRATS[id];
      if (cat && s.category !== cat) return false;
      if (kw && (s.name + ' ' + (s.desc || '') + ' ' + (s.factors || []).join(' ')).toLowerCase().indexOf(kw.toLowerCase()) < 0) return false;
      return true;
    });
    var sel = document.getElementById('bt-strategy');
    sel.innerHTML = ids.map(function (id) {
      var s = STRATS[id];
      return '<option value="' + id + '">' + R._f(s.name) + '（' + R._f(s.category) + '）</option>';
    }).join('') || '<option value="">无匹配策略</option>';
    var target = ids.indexOf(saved) >= 0 ? saved : ids[0];
    if (target) sel.value = target;
    applyStrategyMeta();
  }
  function loadStrategies() {
    return LW.api.get('/api/live/backtest_strategies').then(function (d) {
      STRATS = (d && d.strategies) || {};
      renderStrategyOptions();
    }).catch(function () {
      // 兜底：目录接口不可用时不阻塞（仅内置两个）
      STRATS = {
        tech3: { name: '技术三因子', category: '策略', instant: true, desc: 'rps_120 反转 + lowvol_60 反转 + near_high_250 正向（月频）', factors: ['rps_120', 'lowvol_60', 'near_high_250'], defaults: { topn: 5, stocks: 300 } },
        script1: { name: '大市值三因子', category: '复刻', instant: true, desc: '营收增长率 + 市值 + Beta（月频）', factors: ['营收增长率', '市值', 'Beta'], defaults: { topn: 5, stocks: 300 } }
      };
      renderStrategyOptions();
    });
  }
  document.getElementById('bt-cat-filter').addEventListener('change', renderStrategyOptions);
  document.getElementById('bt-search').addEventListener('input', renderStrategyOptions);
  document.getElementById('bt-strategy').addEventListener('change', function () {
    try { localStorage.setItem('bt.strategy', this.value); } catch (e) {}
    applyStrategyMeta();
  });
  loadStrategies();

  document.getElementById('bt-run').onclick = function () {
    var q = 'strategy=' + encodeURIComponent(document.getElementById('bt-strategy').value) +
      '&topn=' + document.getElementById('bt-topn').value +
      '&stocks=' + document.getElementById('bt-stocks').value +
      '&start=' + encodeURIComponent(document.getElementById('bt-start').value) +
      '&end=' + encodeURIComponent(document.getElementById('bt-end').value);
    document.getElementById('bt-result').innerHTML = '<div class="mini" style="opacity:.7;padding:16px 0">回测运行中…（首次加载数据约 5-15s，勿重复点击）</div>';
    LW.api.get('/api/live/backtest_run?' + q, { timeout: 180000 }).then(function (d) {
      if (!d.ok) { document.getElementById('bt-result').innerHTML = '<div class="mini" style="color:var(--red)">失败：' + (d.error || '未知') + '</div>'; return; }
      renderResult(d);
      loadArchive();   // 运行后刷新历史记录
    }).catch(function (e) { document.getElementById('bt-result').innerHTML = '<div class="mini" style="color:var(--red)">失败：' + e + '</div>'; });
  };

  (function bindPitchScan() {
    var url = '/api/live/pitch_scan';
    var form = document.getElementById('pitch-form');
    var button = document.getElementById('pitch-run');
    var status = document.getElementById('pitch-status');
    var result = document.getElementById('pitch-result');
    var trainStart = document.getElementById('pitch-train-start');
    var testStart = document.getElementById('pitch-test-start');
    var dataEnd = document.getElementById('pitch-end');
    var profile = document.getElementById('pitch-profile');
    var gridFields = ['topn', 'hold', 'stop', 'target', 'size'];
    var defaults;
    var ready = false, busy = false, submitting = false, timer, lastResult, limits = {};

    function fillGrid() {
      var grid = profile.value === 'drawdown' ? defaults.drawdown_grid : defaults.grid;
      gridFields.forEach(function (field) {
        document.getElementById('pitch-' + field).value = (grid[field] || [1]).map(function (value) {
          return value == null ? 0 : value;
        }).join(', ');
      });
    }

    profile.addEventListener('change', fillGrid);

    function readGrid() {
      var grid = {};
      gridFields.forEach(function (field) {
        var input = document.getElementById('pitch-' + field);
        var label = input.labels[0].textContent.trim();
        var integer = field === 'topn' || field === 'hold';
        var limit = field === 'size' ? 1 : limits[integer ? field + '_max' : 'atr_max'];
        var values = input.value.trim().split(/[,，\s]+/).map(function (value) {
          if (!/^(\d+(\.\d*)?|\.\d+)$/.test(value)) throw new Error(label + '请输入有效数字。');
          var number = Number(value);
          if (!Number.isFinite(number)) throw new Error(label + '请输入有效数字。');
          if (integer && (!Number.isSafeInteger(number) || number < 1)) throw new Error(label + '请输入正整数。');
          if (field === 'size' && number <= 0) throw new Error('仓位系数须大于 0。');
          if (Number.isFinite(limit) && number > limit) throw new Error(label + '取值上限为 ' + limit + '。');
          return number;
        });
        grid[field] = Array.from(new Set(values));
      });
      var combinations = gridFields.reduce(function (count, field) { return count * grid[field].length; }, 1);
      if (profile.value === 'drawdown' && (grid.topn.length !== 1 || grid.hold.length !== 1)) {
        throw new Error('基线回撤约束须固定一个 TopN 和持有期。');
      }
      if (combinations > limits.max_combinations) throw new Error('共 ' + combinations + ' 组参数，最多可扫描 ' + limits.max_combinations + ' 组。');
      return grid;
    }

    function number(value) { return Number.isFinite(value) ? String(value) : '—'; }
    function points(value) {
      return Number.isFinite(value) ? (value > 0 ? '+' : '') + (value * 100).toFixed(2) + ' 个百分点' : '—';
    }
    function multiple(value) { return value ? number(value) + '×' : '关闭'; }
    function range(window) { return escArchive(window.start) + ' 至 ' + escArchive(window.end); }

    function renderScan(data) {
      var dataKey = data && (data.generated_at || JSON.stringify(data));
      if (!data || dataKey === lastResult) return;
      var selected = data.selected || [];
      var rows = [{ name: '基线', model: data.baseline }];
      if (data.reference) rows.push({ name: '原持有方案', model: data.reference });
      var groups = { size: '只调仓位', exit: '只调退出', both: '仓位与退出' };
      rows = rows.concat(selected.map(function (model, index) {
        var group = groups[model.group];
        return { name: group ? '入围 ' + (index + 1) + ' · ' + group : '筛选第 ' + (index + 1) + ' 名', model: model };
      }));
      var table = '<div class="pitch-scroll"><table class="bt-stat pitch-table"><thead><tr>' +
        '<th scope="col">组合</th><th scope="col">TopN</th><th scope="col">最长持有</th><th scope="col">止损</th><th scope="col">止盈</th><th scope="col">仓位系数</th>' +
        '<th scope="col">筛选期年化</th><th scope="col">样本外年化</th><th scope="col">样本外最大回撤</th><th scope="col">样本外夏普</th>' +
        '<th scope="col">样本外成交笔数</th><th scope="col">样本外最差 5% 平均</th></tr></thead><tbody>' +
        rows.map(function (row) {
          var p = row.model.params, train = row.model.train, test = row.model.test;
          return '<tr><td>' + row.name + '</td><td>' + number(p.topn) + '</td><td>' + number(p.hold) + ' 日</td>' +
            '<td>' + multiple(p.stop) + '</td><td>' + multiple(p.target) + '</td><td>' + pct(p.size == null ? 1 : p.size) + '</td><td>' + pct(train.annual_return) + '</td>' +
            '<td><strong>' + pct(test.annual_return) + '</strong></td><td>' + pct(test.max_drawdown) + '</td><td>' +
            (Number.isFinite(test.sharpe) ? test.sharpe.toFixed(2) : '—') + '</td><td>' + number(test.n_trades) + '</td><td>' + pct(test.tail) + '</td></tr>';
        }).join('') + '</tbody></table></div>';
      var details = rows.map(function (row, index) {
        var model = row.model, edge = model.edge || {}, ci = edge.ci || [], years = model.years || [];
        return '<details' + (index === (data.reference ? 2 : 1) ? ' open' : '') + '><summary>' + row.name + '的样本外分年表现</summary>' +
          (index > 0 ? '<p class="mini">相对基线日收益差 ' + points(edge.mean) +
          (ci.every(Number.isFinite) && ci.length === 2 ? '（95% 区间 ' + points(ci[0]) + ' 至 ' + points(ci[1]) + '）' : '') + '</p>' : '') +
          '<div class="pitch-scroll"><table class="bt-stat pitch-table"><thead><tr><th scope="col">年份</th><th scope="col">区间净收益</th>' +
          '<th scope="col">最大回撤</th><th scope="col">区间较基线差</th><th scope="col">成交笔数</th></tr></thead><tbody>' +
          years.map(function (year) {
            return '<tr><td>' + escArchive(year.year) + '</td><td>' + pct(year.total_return) + '</td><td>' + pct(year.max_drawdown) +
              '</td><td>' + points(year.total_edge) + '</td><td>' + number(year.n_trades) + '</td></tr>';
          }).join('') + '</tbody></table></div></details>';
      }).join('');
      var windows = data.windows;
      result.innerHTML = '<h3>最近一次扫描结果</h3><p class="mini">网格 ' + number(data.candidate_count) + ' 组 · 回测 ' + number(data.evaluated_count || data.candidate_count) + ' 组 · ' + escArchive(data.objective) +
        ' · ' + escArchive(data.generated_at) + '</p><p class="mini">筛选期信号 ' + range(windows.train) + ' · 样本外信号 ' + range(windows.test) +
        ' · 行情截止 ' + escArchive(windows.test.execution_end) + '</p>' + (data.verdict ? '<p>' + escArchive(data.verdict) + '</p>' : '') + table + details +
        (data.notes && data.notes.length ? '<details><summary>成交口径与数据范围</summary><ul class="mini">' + data.notes.map(function (note) {
          return '<li>' + escArchive(note) + '</li>';
        }).join('') + '</ul></details>' : '');
      lastResult = dataKey;
    }

    function syncButton() {
      button.disabled = !ready || busy || submitting;
    }

    function setJob(job) {
      busy = !!job && ['queued', 'running'].includes(job.status);
      if (busy) status.textContent = '正在扫描历史并验证入选组合。可以离开此页，完成后回来查看结果。';
      else if (job && job.error) status.textContent = '扫描未完成 · ' + job.error;
      else status.textContent = lastResult ? '最近一次扫描已完成' : '等待运行';
      syncButton();
    }

    function queueRefresh(delay) {
      clearTimeout(timer);
      timer = setTimeout(refresh, delay);
    }

    function refresh() {
      return LW.api.get(url, { bypass: true, retry: 0, staleFallback: false }).then(function (data) {
        if (!data.ok) throw new Error(data.error || '未返回扫描状态');
        if (!ready) {
          trainStart.value = data.defaults.train_start;
          testStart.value = data.defaults.test_start;
          dataEnd.value = data.defaults.end || '';
          defaults = data.defaults;
          limits = defaults.limits || {};
          profile.options[1].disabled = !defaults.drawdown_grid;
          if (defaults.drawdown_grid && data.latest && data.latest.request.profile === 'drawdown') profile.value = 'drawdown';
          fillGrid();
          ready = true;
        }
        renderScan(data.latest);
        setJob(data.job);
        if (busy) queueRefresh(2500);
      }).catch(function (error) {
        status.textContent = '暂时无法读取扫描状态 · ' + error.message;
        queueRefresh(5000);
      });
    }

    form.onsubmit = function (event) {
      event.preventDefault();
      if (button.disabled) return;
      var payload;
      try {
        if (trainStart.value >= testStart.value || (dataEnd.value && testStart.value >= dataEnd.value)) {
          throw new Error('日期顺序应为筛选期开始、样本外开始、数据截止。');
        }
        payload = { train_start: trainStart.value, test_start: testStart.value, end: dataEnd.value || null, grid: readGrid(), profile: profile.value };
      } catch (error) {
        status.textContent = error.message;
        return;
      }
      clearTimeout(timer);
      submitting = true;
      syncButton();
      status.textContent = '正在提交扫描请求…';
      fetch(url, {
        method: 'POST', cache: 'no-store', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
      }).then(function (response) {
        return response.json().then(function (data) {
          if (response.status === 409 && data.job) return data.job;
          if (!response.ok || !data.ok) throw new Error(data.error || 'HTTP ' + response.status);
          return data.job;
        });
      }).then(function (job) {
        submitting = false;
        setJob(job);
        refresh();
      }).catch(function (error) {
        submitting = false;
        syncButton();
        status.textContent = '无法提交扫描 · ' + error.message;
      });
    };
    refresh();
  })();

  (function bindPitchForward() {
    var status = document.getElementById('pitch-forward-status');
    var comparison = document.getElementById('pitch-forward-comparison');
    var money = new Intl.NumberFormat('zh-CN', { style: 'currency', currency: 'CNY' });
    var labels = {
      not_started: '尚未启动',
      waiting_data: '等待行情数据',
      ready: '数据已就绪',
      running: '运行中'
    };

    function amount(value) { return Number.isFinite(value) ? money.format(value) : '—'; }
    function count(value) { return Number.isInteger(value) ? String(value) : '—'; }

    function renderForward(data) {
      if (!data || !data.ok) throw new Error((data && data.message) || '未返回模拟状态');
      status.textContent = [labels[data.status], data.message].filter(Boolean).join(' · ');
      var readiness = data.readiness || {};
      var closeDate = readiness.close_date || readiness.date;
      var next = data.next_signal;
      var timing = [
        data.start_session && '首个拟成交日 ' + data.start_session,
        data.last_session && '最近结算 ' + data.last_session,
        !data.last_session && data.start_session && '尚无已结算交易日',
        closeDate && '已核验收盘数据 ' + closeDate,
        Number.isInteger(readiness.covered_symbols) && Number.isInteger(readiness.expected_symbols)
          && '行情覆盖 ' + readiness.covered_symbols + '/' + readiness.expected_symbols,
        next && '已锁定 ' + next.trade_date + ' 信号' + (Number.isInteger(next.count) ? '（' + next.count + ' 只）' : '')
      ].filter(Boolean);
      var accounts = data.accounts || {};
      var a = accounts.challenger, b = accounts.baseline;
      var meta = timing.length ? '<p class="mini">' + escArchive(timing.join(' · ')) + '</p>' : '';
      if (!a || !b) {
        comparison.innerHTML = meta;
        return;
      }
      var metrics = [
        ['起始虚拟资金', 'initial_cash', amount],
        ['扣费后账户净值', 'equity', amount],
        ['扣费后累计收益', 'net_return', pct],
        ['最大回撤', 'max_drawdown', pct],
        ['模拟成交笔数', 'fills', count],
        ['累计已扣交易费用', 'fees_paid', amount]
      ];
      var rows = metrics.map(function (metric) {
        var key = metric[1], format = metric[2];
        return '<tr><th scope="row">' + metric[0] + '</th><td>' + format(a[key]) + '</td><td>' + format(b[key]) + '</td></tr>';
      });
      var note = a.fills === 0 && b.fills === 0 ? '两个账户均暂无模拟成交。' : '';
      comparison.innerHTML = meta + '<div class="pitch-scroll"><table class="bt-stat pitch-table"><thead><tr>' +
        '<th scope="col">指标</th><th scope="col">' + escArchive(a.label) + '</th><th scope="col">' +
        escArchive(b.label) + '</th></tr></thead><tbody>' + rows.join('') +
        '</tbody></table></div><p class="mini">按交易日收盘结算。' + note + '</p>';
    }

    function refreshForward() {
      LW.api.get('/api/live/pitch_forward', { bypass: true, staleFallback: false })
        .then(renderForward).catch(function (error) {
          status.textContent = '暂时无法读取前瞻模拟 · ' + error.message;
        }).finally(function () { setTimeout(refreshForward, document.hidden ? 300000 : 60000); });
    }
    refreshForward();
  })();

  /* ---------- 历史记录（只看最新 + 类型 + 有效/无效 + 关键词） ---------- */
  var latest = [], history = [], afLatest = false, afCat = '全部', afVerd = '全部', afKw = '';
  function catColor(c) { return c === '复刻' ? '#8b5cf6' : c === '因子' ? '#2d9cdb' : c === '策略' ? '#27ae60' : '#a1a1aa'; }
  function cardHtml(a) {
    var ann = a.annual_return != null ? pct(a.annual_return) : '—';
    var dd = a.max_drawdown != null ? pct(a.max_drawdown) : '—';
    var shp = a.sharpe != null ? a.sharpe.toFixed(2) : '—';
    var annC = a.annual_return >= 0 ? '#eb5757' : '#27ae60';
    var facs = (a.factors || []).slice(0, 5).map(function (f) { return '<span class="tag-st tag-dim" style="margin-left:4px">' + R._f(f) + '</span>'; }).join('');
    function fname(p) { return String(p || '').split(/[\\/]/).pop(); }
    var sourceUrl=a.evidence_url?evidenceLink(a.evidence_url):null;
    var btn = sourceUrl ? '<a class="v2-btn" href="'+escArchive(sourceUrl)+'" target="_blank" rel="noopener">查看研究来源</a>' : a.has_html
      ? '<a class="v2-btn" href="/dl/backtest_archive/' + encodeURIComponent(fname(a.html)) + '" target="_blank">打开报告</a>'
      : '<a class="v2-btn" style="background:#16161a;color:var(--navy)" href="/dl/backtest_archive/' + encodeURIComponent(fname(a.json)) + '" target="_blank">查看JSON</a>';
    var latestBadge = a.is_latest ? '<span class="vtag" style="background:rgba(94,106,210,.14);color:#8b5cf6">最新</span>' : '';
    return '<div class="v2-card" style="margin-top:0;padding:14px 16px">' +
      '<div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap">' +
        '<span><b>' + R._f(a.title || a.name || '回测') + '</b>' + latestBadge +
          '<span class="vtag" style="background:' + catColor(a.category) + '1a;color:' + catColor(a.category) + '">' + a.category + '</span>' +
          '<span class="vtag ' + (a.verdict === '有效' ? 'vtag-yx' : 'vtag-wx') + '">' + a.verdict + '</span>' +
        '</span>' +
        '<span class="mini" style="opacity:.6">' + R._f(a.generated_at || '') + '</span></div>' +
      '<div class="mini" style="margin:6px 0 4px;color:#a1a1aa">' + facs + '</div>' +
      (a.kind==='research_evidence' && a.annual_return==null?'':'<div class="mini" style="margin:6px 0;color:#a1a1aa">年化 <b style="color:' + annC + '">' + ann + '</b> · 回撤 <b style="color:#27ae60">' + dd + '</b> · 夏普 <b>' + shp + '</b></div>') +
      '<div class="mini" style="line-height:1.9;opacity:.7">'+escArchive(a.evidence_summary||'')+(a.source?'<br>来源：'+escArchive(a.source):'')+(a.limitations&&a.limitations.length?'<br>'+a.limitations.map(escArchive).join('；'):'')+'</div>'+btn+'</div>';
  }
  function renderArchive() {
    var src = afLatest ? latest : latest.concat(history);
    var kw = afKw.trim().toLowerCase();
    var list = src.filter(function (a) {
      var catOk = afCat === '全部' || a.category === afCat;
      var verdOk = afVerd === '全部' || a.verdict === afVerd;
      var kwOk = !kw || (a.name || '').toLowerCase().indexOf(kw) >= 0 ||
        (a.title || '').toLowerCase().indexOf(kw) >= 0 || (a.factors || []).join(',').toLowerCase().indexOf(kw) >= 0;
      return catOk && verdOk && kwOk;
    });
    var host = document.getElementById('bt-archive');
    if (!list.length) { host.innerHTML = '<div class="mini" style="opacity:.6;padding:10px 0">无匹配记录。</div>'; return; }
    host.innerHTML = '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px">' +
      list.slice(0, 100).map(cardHtml).join('') + '</div>';
  }
  function loadArchive() {
    LW.api.get('/api/live/backtest_archive').then(function (d) {
      latest = (d && d.latest) || [];
      history = (d && d.history) || [];
      var all = latest.concat(history);
      var cats = ['全部'].concat(Array.from(new Set(all.map(function (a) { return a.category; }))));
      var verds = ['全部'].concat(Array.from(new Set(all.map(function(a){return a.verdict;}).filter(Boolean))));
      document.getElementById('bt-count').textContent = '当前研究/最新 ' + latest.length + ' · 历史归档 ' + history.length + (d.reason?' · '+d.reason:'');
      document.getElementById('bt-filter').innerHTML =
        '<label class="mini" style="display:flex;align-items:center;gap:4px;cursor:pointer">' +
          '<input type="checkbox" id="bt-latest"> 只看最新</label>' +
        '<span class="mini">类型</span>' +
        '<select id="bt-cat" class="lf-btn" style="cursor:pointer">' + cats.map(function (c) { return '<option>' + c + '</option>'; }).join('') + '</select>' +
        '<span class="mini">验证层级</span>' +
        '<select id="bt-verd" class="lf-btn" style="cursor:pointer">' + verds.map(function (c) { return '<option>' + c + '</option>'; }).join('') + '</select>' +
        '<input id="bt-kw" placeholder="搜索名称/标题/因子" style="flex:1;min-width:160px;padding:6px 10px;border:1px solid #2a2a30;border-radius:8px;font-size:12px;outline:none">';
      document.getElementById('bt-latest').onchange = function () { afLatest = this.checked; renderArchive(); };
      document.getElementById('bt-cat').onchange = function () { afCat = this.value; renderArchive(); };
      document.getElementById('bt-verd').onchange = function () { afVerd = this.value; renderArchive(); };
      document.getElementById('bt-kw').oninput = function () { afKw = this.value; renderArchive(); };
      renderArchive();
    }).catch(function () { document.getElementById('bt-archive').innerHTML = '<div class="mini" style="opacity:.6">历史加载失败</div>'; });
  }
  loadArchive();
})();
</script>
